version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: authserver-sqlserver
    environment:
      SA_PASSWORD: "Ac$$App@123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Ac$$App@123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: authserver-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: authserver-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./src/main/resources/db:/db:ro
      - ./scripts:/scripts:ro
    entrypoint: /bin/bash
    command: >
      -c "
        echo 'Waiting for SQL Server...' &&
        sleep 5 &&
        echo 'Running DB init script...' &&
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Ac\$$App@123' -C -i /scripts/init-db.sql &&
        echo 'DB initialization complete!'
      "

volumes:
  sqlserver-data:
  redis-data:
