name: Portal

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/portal.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/portal.yml"

permissions:
  contents: read

jobs:
  static-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    needs: static-gates
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -t identity-portal:ci web
      - name: Verify non-root runtime user
        run: test "$(docker image inspect --format '{{.Config.User}}' identity-portal:ci)" = portal
      - name: Run the image and probe liveness
        run: |
          docker run -d --name portal-ci -p 127.0.0.1:3100:3100 identity-portal:ci
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/healthz; then ready=1; break; fi
            sleep 1
          done
          docker rm -f portal-ci || true
          test "$ready" = 1
