spring.application.name=authserver
server.port=9080
server.servlet.context-path=${SERVER_CONTEXT_PATH:/services}
server.base-path=${SERVER_BASE_PATH:http://localhost:9080/services}
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=AGSAuth;encrypt=true;trustServerCertificate=false}
spring.datasource.username=${DB_USERNAME:acsapp}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.database.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
cache.application.getbyid.ttl=30000
app.database.query-timeout=15
app.datasource.hikari.maximum-pool-size=40
app.datasource.hikari.minimum-idle=20
app.datasource.hikari.connection-timeout=30000
app.datasource.hikari.idle-timeout=600000
app.datasource.hikari.max-lifetime=1800000
app.datasource.hikari.leak-detection-threshold=600000
app.datasource.hikari.validation-timeout=5000


server.error.whitelabel.enabled=false
spring.web.resources.add-mappings=true
# Thymeleaf configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=true

key-store.password=${KEY_STORE_PASSWORD:}
client-secret-jwt.max-active=2
ascensus.url.unite.mobile=
http.proxyHost=
http.proxyPort=80
http.nonProxyHosts=
ascensus.auth.server.root-url=
ascensus.auth.server.token-endpoint=
ascensus.auth.server.jwks-endpoint=
ascensus.auth.server.org-id=
ascensus.auth.server.client-id=
ascensus.auth.server.shared-secret=
secureauth.connect-timeout=3000
secureauth.read-timeout=3000
validation.password.regex=^(?=.*[A-Z])(?=.*[a-z])(?=.*\\d)(?=.*[@$!%*?&])[A-Za-z\\d@$!%*?&]{12,}$
toggles.signature.required=false
toggles.fingerprinting.enabled=true
toggles.fingerprint.referer.disabled=true
toggles.fingerprinting.referer.disabled=true
ascensus.url.notification=
validation.email.regexp=^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$
validation.phone.regexp=^[+0-9() .-]{7,25}$
toggles.account.sync.type=none
ascensus.url.account=
toggles.login.try-harder-enabled=true
toggles.updated-login.enabled=true
crypto.web.base.url=http://localhost:9001
hasher.password=${AUTH_HASHER_PASSWORD:}
hasher.keystorefile=${AUTH_HASHER_KEYSTORE:classpath:keystore.jks}
hasher.pepper=${AUTH_HASHER_PEPPER:}
hasher.keystoretype=JCEKS
hasher.iterations=20000
cms.file.location=classpath:cms/

spring.session.store-type=redis
spring.session.timeout=1800
spring.session.redis.namespace=authserver:v2:session
spring.session.redis.repository-type=indexed
spring.session.redis.cleanup-cron=0 */5 * * * *

spring.cache.type=redis
spring.cache.redis.time-to-live=180000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=authserver:v2:cache:

spring.data.redis.host=localhost
spring.data.redis.port=6379

cache.organization.ttl=300000
cache.application.ttl=180000
cache.token.ttl=120000
cache.session.ttl=90000
cache.registered-client.ttl=180000
cache.credential-secrets.ttl=180000
cache.token-by-value-hash.ttl=300000
cache.external-source.ttl=300000

crypto.web.connect-timeout=5000
crypto.web.read-timeout=10000
crypto.web.connection-pool.max-connections=100
crypto.web.connection-pool.max-per-route=50

endpoints.web.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:9080

toggles.biometric.enabled=true
base-url.added=loginBelowHelpHTML
# Persist the OIDC signing identity; never generate a replacement on each startup.
auth.signing.keystore=${AUTH_SIGNING_KEYSTORE:file:./.local/signing.p12}
auth.signing.alias=${AUTH_SIGNING_ALIAS:authserver-signing}
logback.access.config=classpath:logback-access.xml

# Declares integration configuration only; never asserts provider connectivity or certification.
portal.provider-mode=${PORTAL_PROVIDER_MODE:unconfigured}

# Bound certificate file allocation; multipart overhead has a separate bounded budget.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
