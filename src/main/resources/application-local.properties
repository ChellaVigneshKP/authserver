# Explicit local development profile. Supply credentials through the environment.
server.address=127.0.0.1
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=AGSAuth;encrypt=true;trustServerCertificate=true}
spring.thymeleaf.cache=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Fingerprints stay enabled. External sync is disabled, external MFA is not simulated.
toggles.account.sync.type=none
app.local.bootstrap.enabled=${LOCAL_BOOTSTRAP_ENABLED:false}
app.local.admin.username=${LOCAL_ADMIN_USERNAME:admin}
app.local.admin.password=${LOCAL_ADMIN_PASSWORD:}
app.local.callback-url=${LOCAL_CALLBACK_URL:http://localhost:9080/services/local/callback}
# Local-only integrations are not simulated and must be configured to exercise them.
toggles.login.try-harder-enabled=false
toggles.biometric.enabled=false

spring.devtools.restart.enabled=false
spring.devtools.add-properties=false
server.error.include-stacktrace=never
server.error.include-message=never
