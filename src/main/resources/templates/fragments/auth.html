<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(pageTitle)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${pageTitle}">Sign in</title><link rel="stylesheet" th:href="@{/css/auth.css}"><script defer th:src="@{/js/auth-forms.js}"></script></head><body><header th:fragment="header"><p class="brand" th:text="${planName ?: 'Identity services'}">Identity services</p><h1 th:text="${title ?: formTitle ?: 'Account access'}">Account access</h1><p th:if="${subtitle}" th:text="${subtitle}"></p><p th:if="${description}" th:text="${description}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p><p class="success" role="status" th:if="${success}" th:text="${success}"></p><p class="error" role="alert" data-form-error hidden></p></header></body></html>
