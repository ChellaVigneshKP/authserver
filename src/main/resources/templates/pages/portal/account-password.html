<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change password</title><link rel="stylesheet" th:href="@{/css/auth.css}"><script defer th:src="@{/js/hosted-account.js}"></script></head><body><main><h1>Change password</h1><p>Signed in as <strong th:text="${username}"></strong>.</p><p>Changing your password signs this login out of all applications. You will need to sign in again.</p><form method="post" th:attr="action=@{/portal/account/password}" data-hosted-account>
<input type="hidden" name="_csrf" th:value="${_csrf.token}"><input type="hidden" name="nonce" th:value="${nonce}"><input type="hidden" name="clientId" th:value="${clientId}"><input type="hidden" name="expectedLoginId" th:value="${expectedLoginId}"><input type="hidden" name="returnTo" th:value="${returnUrl}"><input type="hidden" name="x-request-datetime" th:value="${datetime}">
<label for="currentPassword">Current password</label><input id="currentPassword" name="currentPassword" type="password" maxlength="1024" autocomplete="current-password" required>
<label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" maxlength="1024" autocomplete="new-password" required>
<label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirmPassword" type="password" maxlength="1024" autocomplete="new-password" required>
<button type="submit">Change password</button><noscript>JavaScript is required to format this account request.</noscript></form><p><a th:href="${returnUrl}">Cancel</a></p></main></body></html>
