<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change profile</title><link rel="stylesheet" th:href="@{/css/auth.css}"><script defer th:src="@{/js/hosted-account.js}"></script></head><body><main><h1>Change profile</h1><p>Signed in as <strong th:text="${username}"></strong>.</p><form method="post" th:attr="action=@{/portal/account/profile}" data-hosted-account>
<input type="hidden" name="_csrf" th:value="${_csrf.token}"><input type="hidden" name="nonce" th:value="${nonce}"><input type="hidden" name="clientId" th:value="${clientId}"><input type="hidden" name="expectedLoginId" th:value="${expectedLoginId}"><input type="hidden" name="returnTo" th:value="${returnUrl}"><input type="hidden" name="x-request-datetime" th:value="${datetime}">
<label for="firstName">First name</label><input id="firstName" name="firstName" th:value="${firstName}" maxlength="255" autocomplete="given-name" required>
<label for="lastName">Last name</label><input id="lastName" name="lastName" th:value="${lastName}" maxlength="255" autocomplete="family-name" required>
<label for="email">Email address</label><input id="email" name="email" th:value="${email}" type="email" maxlength="255" autocomplete="email" required>
<label for="confirmEmail">Confirm email address</label><input id="confirmEmail" name="confirmEmail" th:value="${email}" type="email" maxlength="255" required>
<label for="phoneNumber">Phone number</label><input id="phoneNumber" name="phoneNumber" th:value="${phoneNumber}" type="tel" maxlength="128" autocomplete="tel" required>
<label for="secondaryPhoneNumber">Secondary phone number (optional)</label><input id="secondaryPhoneNumber" name="secondaryPhoneNumber" th:value="${secondaryPhoneNumber}" type="tel" maxlength="128">
<button type="submit">Update profile</button><noscript>JavaScript is required to format this account request.</noscript></form><p><a th:href="${returnUrl}">Cancel</a></p></main></body></html>
