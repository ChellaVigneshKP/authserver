<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header.html :: head(${metaTitle != null ? metaTitle : 'Request PIN'})}"></head>
<body>
    <style th:if="${planPrimaryColor != null and !planPrimaryColor.isEmpty()}">
        :root {
            --plan-primary-color: [[${planPrimaryColor}]];
            --plan-secondary-color: [[${planSecondaryColor != null ? planSecondaryColor : '#1d3557'}]];
            --plan-tertiary-color: [[${planTertiaryColor != null ? planTertiaryColor : '#457b9d'}]];
        }
        
        .btn-primary {
            background-color: var(--plan-primary-color) !important;
        }
        
        .btn-primary:hover {
            background-color: var(--plan-secondary-color) !important;
        }
    </style>
    
    <div class="page-container">
        <div class="layout-grid">
            <!-- Sidebar -->
            <div class="sidebar-container" th:if="${progressSidebarSteps != null}">
                <div th:replace="~{fragments/sidebar.html :: sidebar}"></div>
            </div>
            
            <!-- Main Content -->
            <div class="main-content">
                <div class="logo-container" th:if="${logo != null and !logo.isEmpty()}">
                    <img th:src="${logo}" alt="Logo">
                </div>
                
                <div class="card">
                    <div class="step-indicator" th:if="${loginPinRequestStep2 != null}" 
                         th:text="${loginPinRequestStep2}">PIN REQUEST (STEP 2 OF 3)</div>
                    
                    <h1 th:text="${title != null ? title : 'Request a PIN'}">Request a PIN</h1>
                    <p class="subtitle" th:text="${subtitle}" th:if="${subtitle != null}">Choose how you'd like to receive your PIN</p>
                    <p class="description" th:text="${description}" th:if="${description != null}">Additional description</p>
                    
                    <!-- Error Messages -->
                    <div class="alert alert-error" th:if="${error != null}">
                        <span th:text="${error}">Error message</span>
                    </div>
                    
                    <!-- PIN Request Form -->
                    <form th:action="@{/mfa/{flow}/request-pin(flow=${flow})}" method="post">
                        <div class="form-group">
                            <label for="option">Select delivery method:</label>
                            <select id="option" name="option" required class="select-option">
                                <option value="">-- Choose an option --</option>
                                <option th:each="opt : ${options}" 
                                        th:value="${opt.value}" 
                                        th:text="${opt.text}">Option</option>
                            </select>
                        </div>
                        
                        <div class="button-group">
                            <a th:href="${backUrlPath != null ? backUrlPath : '@{/login}'}" 
                               class="btn btn-secondary">Back</a>
                            <button type="submit" class="btn btn-primary">Request PIN</button>
                        </div>
                    </form>
                    
                    <div class="cancel-section mt-3" th:if="${cancelUrl != null and disableCancel == null}">
                        <a th:href="${cancelUrl}" class="btn-link">Cancel</a>
                    </div>
                </div>
                
                <!-- Contact Info -->
                <div class="contact-info" th:if="${contact != null and !contact.isEmpty()}">
                    <div th:utext="${contact}"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <div th:replace="~{fragments/footer.html :: footer}"></div>
    
    <style>
        .page-container {
            min-height: 100vh;
            padding: 20px;
        }
        
        .layout-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .main-content {
            max-width: 600px;
        }
        
        .step-indicator {
            background-color: #e7f3ff;
            color: #2d65b4;
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            display: inline-block;
        }
        
        .select-option {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 1rem;
            background-color: white;
            cursor: pointer;
        }
        
        .select-option:focus {
            outline: none;
            border-color: var(--plan-primary-color, #2d65b4);
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        
        .button-group .btn {
            flex: 1;
        }
        
        .cancel-section {
            text-align: center;
            padding-top: 15px;
            border-top: 1px solid #dee2e6;
        }
        
        .contact-info {
            margin-top: 30px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #666;
        }
        
        @media (max-width: 992px) {
            .layout-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .button-group .btn {
                width: 100%;
            }
        }
    </style>
</body>
</html>
