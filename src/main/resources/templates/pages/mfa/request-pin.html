<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/auth :: head('Identity services')}"></head><body><main><header th:replace="~{fragments/auth :: header}"></header><form method="post" th:action="@{/mfa/{flow}/request-pin(flow=${flow})}"><fieldset><legend>Choose where to receive your verification code</legend><label th:each="option : ${options}"><input type="radio" name="option" th:value="${option.value}" required><span th:text="${option.text}"></span></label></fieldset><p th:if="${#lists.isEmpty(options)}">No verification methods are available. Contact your application administrator.</p><button th:disabled="${#lists.isEmpty(options)}" type="submit">Send code</button></form></main></body></html>
