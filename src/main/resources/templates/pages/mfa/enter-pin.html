<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/auth :: head('Identity services')}"></head><body><main><header th:replace="~{fragments/auth :: header}"></header><form method="post" th:action="@{/mfa/{flow}/verify-pin(flow=${flow})}"><label for="pin">Verification code</label><input id="pin" name="pin" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button type="submit" th:text="${confirmText ?: 'Verify code'}">Verify code</button></form><nav><a th:href="@{/mfa/{flow}/request-pin(flow=${flow})}">Request another code</a></nav></main></body></html>
