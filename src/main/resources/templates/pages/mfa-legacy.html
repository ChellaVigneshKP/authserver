<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/auth :: head('Identity services')}"></head><body><main><header th:replace="~{fragments/auth :: header}"></header><h2>Verification code</h2><form method="post" th:action="@{/mfa}"><label th:each="n : ${#numbers.sequence(1,6)}" th:for="${'mfa-number-' + n}">Digit <span th:text="${n}"></span><input th:id="${'mfa-number-' + n}" th:name="${'mfa-number-' + n}" inputmode="numeric" pattern="[0-9]" maxlength="1" required></label><button type="submit">Verify code</button></form></main></body></html>
