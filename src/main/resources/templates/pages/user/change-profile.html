<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/auth :: head('Identity services')}"></head><body><main><header th:replace="~{fragments/auth :: header}"></header><form method="post" th:action="@{/user/change-profile}" th:attr="data-sso-url=@{/oauth2/sso}" data-signed-profile><label for="firstName">First name</label><input id="firstName" name="firstName" th:value="${firstName}" required><label for="lastName">Last name</label><input id="lastName" name="lastName" th:value="${lastName}" required><label for="email">Email address</label><input id="email" name="email" th:value="${email}" type="email" required><label for="confirmEmail">Confirm email address</label><input id="confirmEmail" name="confirmEmail" th:value="${confirmEmail}" type="email" required><label for="phoneNumber">Phone number</label><input id="phoneNumber" name="phoneNumber" th:value="${phoneNumber}" required><label for="secondaryPhoneNumber">Secondary phone number (optional)</label><input id="secondaryPhoneNumber" name="secondaryPhoneNumber" th:value="${secondaryPhoneNumber}"><button type="submit">Update profile</button></form><nav><a th:href="${backUrlPath}">Cancel</a></nav></main></body></html>
