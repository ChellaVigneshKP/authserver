<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header.html :: head(${metaTitle != null ? metaTitle : 'Change Password'})}"></head>
<body>
    <div class="page-container">
        <div class="layout-grid">
            <!-- Sidebar -->
            <div class="sidebar-container" th:if="${progressSidebarSteps != null}">
                <div th:replace="~{fragments/sidebar.html :: sidebar}"></div>
            </div>
            
            <!-- Main Content -->
            <div class="main-content">
                <div class="logo-container" th:if="${logo != null and !logo.isEmpty()}">
                    <img th:src="${logo}" alt="Logo">
                </div>
                
                <div class="card">
                    <h1 th:text="${title != null ? title : 'Change Password'}">Change Password</h1>
                    <p class="subtitle" th:text="${subtitle}" th:if="${subtitle != null}">Update your account password</p>
                    <p class="description" th:text="${passwordChangeDescription}" th:if="${passwordChangeDescription != null}">Enter the information below to change your password</p>
                    
                    <!-- Error Messages -->
                    <div class="alert alert-error" th:if="${error != null}">
                        <span th:text="${error}">Error message</span>
                    </div>
                    
                    <!-- Change Password Form -->
                    <form th:action="@{/user/change-password}" method="post" id="changePasswordForm">
                        <div class="form-section">
                            <h3 th:text="${passwordChangeEnterCurrentPassword}" th:if="${passwordChangeEnterCurrentPassword != null}">Enter current password</h3>
                            
                            <div class="form-group">
                                <label for="currentPassword">Current Password</label>
                                <input type="password" 
                                       id="currentPassword" 
                                       name="currentPassword" 
                                       required 
                                       placeholder="Enter your current password"
                                       autofocus>
                            </div>
                        </div>
                        
                        <div class="form-section mt-3">
                            <h3 th:text="${passwordChangeCreateNewPassword}" th:if="${passwordChangeCreateNewPassword != null}">Create new password</h3>
                            
                            <div class="form-group">
                                <label for="newPassword">New Password</label>
                                <input type="password" 
                                       id="newPassword" 
                                       name="newPassword" 
                                       required 
                                       placeholder="Enter new password"
                                       minlength="8">
                            </div>
                            
                            <div class="form-group">
                                <label for="confirmPassword">Confirm New Password</label>
                                <input type="password" 
                                       id="confirmPassword" 
                                       name="confirmPassword" 
                                       required 
                                       placeholder="Confirm new password"
                                       minlength="8">
                            </div>
                        </div>
                        
                        <div class="password-requirements" th:if="${helpTexts != null}">
                            <p class="requirements-title">Password Requirements:</p>
                            <ul>
                                <li th:each="helpText : ${helpTexts}" th:text="${helpText}">Help text</li>
                            </ul>
                        </div>
                        
                        <p class="required-text" th:if="${passwordChangeRequiredText != null}" th:text="${passwordChangeRequiredText}">All fields are required unless indicated as optional.</p>
                        
                        <div class="button-group">
                            <a th:href="${backUrlPath != null ? backUrlPath : '@{/login}'}" 
                               class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary btn-block">Change Password</button>
                        </div>
                    </form>
                </div>
                
                <!-- Contact Info -->
                <div class="contact-info" th:if="${contact != null and !contact.isEmpty()}">
                    <div th:utext="${contact}"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <div th:replace="~{fragments/footer.html :: footer}"></div>
    
    <style>
        .page-container {
            min-height: 100vh;
            padding: 20px;
        }
        
        .layout-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .main-content {
            max-width: 700px;
        }
        
        .form-section {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .form-section h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #333;
        }
        
        .password-requirements {
            background-color: #e7f3ff;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #2d65b4;
        }
        
        .requirements-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }
        
        .password-requirements ul {
            margin-left: 20px;
            color: #666;
        }
        
        .password-requirements li {
            margin: 8px 0;
        }
        
        .required-text {
            color: #666;
            font-size: 0.9rem;
            font-style: italic;
            margin: 15px 0;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        
        .button-group .btn {
            flex: 1;
        }
        
        .button-group .btn-block {
            flex: 2;
        }
        
        .contact-info {
            margin-top: 30px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #666;
        }
        
        @media (max-width: 992px) {
            .layout-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .button-group .btn {
                width: 100%;
            }
        }
    </style>
    
    <script>
        // Password validation
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('changePasswordForm');
            const newPassword = document.getElementById('newPassword');
            const confirmPassword = document.getElementById('confirmPassword');
            
            form.addEventListener('submit', function(e) {
                if (newPassword.value !== confirmPassword.value) {
                    e.preventDefault();
                    alert('New passwords do not match!');
                    confirmPassword.focus();
                }
            });
        });
    </script>
</body>
</html>
