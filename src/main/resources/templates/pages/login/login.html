<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/auth :: head('Identity services')}"></head><body><main><header th:replace="~{fragments/auth :: header}"></header><form method="post" th:action="@{/login}" data-encode-password><label for="username">Username</label><input id="username" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button><noscript>JavaScript is required to securely format this sign-in request.</noscript></form><nav><a th:href="@{/forgot-password}">Forgot password</a><a th:if="${allowForgotUsername}" th:href="@{/forgot-username}">Forgot username</a><a th:if="${allowActivateAccount}" th:href="@{/activate-account}" th:text="${activateAccountTitle}">Activate account</a></nav></main></body></html>
