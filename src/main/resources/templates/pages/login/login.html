<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${planName} + ' - Sign In'">Sign In</title>
    <link th:if="${planFaviconPath != ''}" rel="icon" th:href="${planFaviconPath}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f1f5f9;
        }
        .login-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        .login-card h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .login-card .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color .15s;
        }
        .form-group input:focus {
            border-color: var(--primary, #2563eb);
            box-shadow: 0 0 0 3px rgba(37,99,235,.1);
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-text, #fff);
            background: var(--primary, #2563eb);
            cursor: pointer;
            margin-top: 8px;
            transition: opacity .15s;
        }
        .btn-primary:hover { opacity: .9; }
        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .alert-success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
    <style th:inline="css">
        :root {
            --primary: [[${planPrimaryColor ?: '#2563eb'}]];
            --secondary: [[${planSecondaryColor ?: '#1e293b'}]];
            --primary-text: [[${planPrimaryTextColor ?: '#ffffff'}]];
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1 th:text="${formTitle ?: 'Sign In'}" style="color: var(--secondary)">Sign In</h1>
        <p class="subtitle" th:text="${intro?.summary ?: ''}"></p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username"
                       th:text="${usernameType == 'email' ? 'Email Address' : 'Username'}">Username</label>
                <input type="text" id="username" name="username" required autofocus
                       th:placeholder="${usernameType == 'email' ? 'Enter your email' : 'Enter your username'}">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       placeholder="Enter your password">
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div th:if="${contact != '' and contact != null}" class="footer-text" th:utext="${contact}"></div>
        <div th:if="${footerHTML != '' and footerHTML != null}" class="footer-text" th:utext="${footerHTML}"></div>
    </div>
    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            var pwdInput = document.getElementById('password');
            pwdInput.value = btoa(pwdInput.value);
        });
    </script>
</body>
</html>
