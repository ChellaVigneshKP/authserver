<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header.html :: head('Login')}"></head>
<body>
    <div class="container">
        <div class="card" style="max-width: 500px; margin: 50px auto;">
            <div class="logo-container">
                <h1>Sign In</h1>
            </div>
            
            <!-- Error Messages -->
            <div class="alert alert-error" th:if="${loginError}">
                <span>Invalid username or password. Please try again.</span>
            </div>
            
            <div class="alert alert-error" th:if="${lockedAccountError}">
                <span>Your account has been locked. Please contact support.</span>
            </div>
            
            <!-- Login Form -->
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           required 
                           placeholder="Enter your username" 
                           autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           required 
                           placeholder="Enter your password">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block mt-3">Sign In</button>
            </form>
            
            <!-- Additional Links -->
            <div class="form-links mt-3">
                <a th:href="@{/forgot-password}">Forgot Password?</a>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <div th:replace="~{fragments/footer.html :: footer}"></div>
    
    <style>
        .form-links {
            text-align: center;
            font-size: 0.9rem;
        }
        
        .form-links a {
            color: #2d65b4;
            text-decoration: none;
        }
        
        .form-links a:hover {
            text-decoration: underline;
        }
    </style>
</body>
</html>
